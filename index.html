<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Data Engineer Study Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      transition: background 0.3s ease, color 0.3s ease;
    }
    :root {
      --bg: #1f2937;
      --text: #f9fafb;
      --card: #111827;
      --highlight: #facc15;
      --done: #9ca3af;
    }
    .light-mode {
      --bg: #f9fafb;
      --text: #1f2937;
      --card: #ffffff;
      --highlight: #d97706;
      --done: #6b7280;
    }
    h1, h2 {
      text-align: center;
      color: var(--text);
    }
    .toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .toggle button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background-color: #4b5563;
      color: #fff;
      cursor: pointer;
    }
    .progress-container {
      background-color: #374151;
      border-radius: 9999px;
      overflow: hidden;
      margin: 1rem auto;
      width: 80%;
      height: 24px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #34d399, #10b981);
      transition: width 0.4s ease-in-out;
    }
    .day {
      background: var(--card);
      border-radius: 12px;
      margin: 1rem 0;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .day h3 {
      margin: 0 0 0.5rem 0;
      color: var(--highlight);
    }
    .topics {
      margin-bottom: 0.5rem;
    }
    .topic {
      display: flex;
      align-items: center;
    }
    .topic input[type="checkbox"] {
      margin-right: 10px;
    }
    .done {
      text-decoration: line-through;
      color: var(--done);
    }
  </style>
</head>
<body>
  <h1>🌙 AWS Data Engineer - 15 Day Tracker</h1>
  <div class="toggle">
    <button onclick="toggleTheme()">Toggle Light/Dark Mode</button>
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="days"></div>

  <script>
    const studyPlan = [
      { day: 'Day 1', topics: [ 'DEA-C01 exam structure and objectives', 'Study plan setup and resource collection' ] },
      { day: 'Day 2', topics: [ 'Amazon Kinesis (Data Streams, Firehose)', 'AWS Glue for ingestion', 'AWS Database Migration Service (DMS)' ] },
      { day: 'Day 3', topics: [ 'Amazon S3 and lifecycle policies', 'Amazon Redshift', 'DynamoDB and RDS basics', 'AWS Lake Formation' ] },
      { day: 'Day 4', topics: [ 'AWS Glue (Crawlers, Jobs)', 'AWS Lambda', 'Amazon EMR basics' ] },
      { day: 'Day 5', topics: [ 'AWS Step Functions', 'Managed Workflows for Apache Airflow (MWAA)' ] },
      { day: 'Day 6', topics: [ 'IAM roles and policies', 'Encryption: SSE, KMS', 'Lake Formation permissions' ] },
      { day: 'Day 7', topics: [ 'Recap of all topics from Week 1', 'Practice questions' ] },
      { day: 'Day 8', topics: [ 'Amazon Athena', 'Redshift Spectrum', 'Amazon QuickSight' ] },
      { day: 'Day 9', topics: [ 'Data modeling: Star/Snowflake schema', 'Table partitioning in Redshift and S3' ] },
      { day: 'Day 10', topics: [ 'CloudWatch and CloudTrail for monitoring', 'AWS Cost Explorer and Trusted Advisor' ] },
      { day: 'Day 11', topics: [ 'Event-driven pipeline design', 'Hybrid and multi-region architectures' ] },
      { day: 'Day 12', topics: [ 'Well-Architected Big Data & Analytics Lens', 'Data lake architecture patterns' ] },
      { day: 'Day 13', topics: [ 'Take full-length practice test', 'Review wrong answers and explanations' ] },
      { day: 'Day 14', topics: [ 'Take second mock test', 'Revisit concepts from incorrect answers' ] },
      { day: 'Day 15', topics: [ 'Light review of notes and service summaries', 'Relax and prepare mentally for the exam' ] }
    ];

    const container = document.getElementById('days');
    let totalTopics = 0, completed = 0;
    let savedProgress = JSON.parse(localStorage.getItem('deaProgress') || '{}');

    studyPlan.forEach(({ day, topics }, dayIndex) => {
      const div = document.createElement('div');
      div.className = 'day';
      div.innerHTML = `<h3>${day}</h3>`;
      const list = document.createElement('div');
      list.className = 'topics';

      topics.forEach((topic, topicIndex) => {
        totalTopics++;
        const topicId = `d${dayIndex}-t${topicIndex}`;
        const checked = savedProgress[topicId];

        const topicDiv = document.createElement('div');
        topicDiv.className = 'topic';
        topicDiv.innerHTML = `
          <input type="checkbox" id="${topicId}" ${checked ? 'checked' : ''} onchange="toggleProgress(this, '${topicId}')">
          <label class="${checked ? 'done' : ''}" for="${topicId}">${topic}</label>
        `;
        list.appendChild(topicDiv);

        if (checked) completed++;
      });

      div.appendChild(list);
      container.appendChild(div);
    });

    function updateProgressBar() {
      document.getElementById('progressBar').style.width = (completed / totalTopics) * 100 + '%';
    }

    updateProgressBar();

    window.toggleProgress = function (checkbox, id) {
      const label = checkbox.nextElementSibling;
      if (checkbox.checked) {
        completed++;
        label.classList.add('done');
        savedProgress[id] = true;
      } else {
        completed--;
        label.classList.remove('done');
        delete savedProgress[id];
      }
      localStorage.setItem('deaProgress', JSON.stringify(savedProgress));
      updateProgressBar();
    };

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }
  </script>
</body>
</html>
